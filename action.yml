name: Amp CI repair
description: Investigate trusted failures in Amp, with durable attempt tracking and automatic squash merges of validated repair PRs.
inputs:
  github-token:
    description: Caller GITHUB_TOKEN with actions/read, contents/read, pull-requests/read, issues/read (legacy ledger) and checks/write.
    required: true
  amp-api-key:
    description: Amp access token from Settings > Security, not a CLI session token.
    required: false
  enabled:
    description: Explicit opt-in. Only the literal true enables repairs.
    default: "false"
  dry-run:
    description: Evaluate eligibility without writing a check, installing Amp, or launching an orb.
    default: "false"
  daily-limit:
    description: Deprecated and ignored for older callers. Repairs have no daily cap.
    required: false
  agent-mode:
    description: Explicit Amp mode (high or external-agent:claude-code). Selection is manual, not automatic failover.
    default: high
runs:
  using: node24
  main: src/main.mjs
